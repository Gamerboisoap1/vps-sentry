# Public HTTPS access for VPS Sentry, with a password in front.
#
# Sentry itself keeps binding to 127.0.0.1 — do NOT set SENTRY_HOST=0.0.0.0.
# nginx is the only process listening publicly, and it proxies inward. That
# way the application is never directly reachable, and authentication cannot
# be bypassed by hitting the port straight.
#
# Why authentication is not optional here: /api/score returns a ranked list of
# this host's weaknesses, /api/users lists who can log in over SSH, and
# /api/ports lists everything listening. Served openly, that is a
# reconnaissance report on the machine it runs on.
#
# Setup:
#   sudo apt install -y nginx apache2-utils certbot python3-certbot-nginx
#   sudo htpasswd -c /etc/nginx/.htpasswd-sentry YOUR_USERNAME
#   sudo cp deploy/nginx-vps-sentry.conf /etc/nginx/sites-available/vps-sentry
#   # replace sentry.example.com below with your domain
#   sudo ln -sf /etc/nginx/sites-available/vps-sentry /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d sentry.example.com     # adds TLS + auto-renewal
#   sudo ufw allow 'Nginx Full'

server {
    listen 80;
    listen [::]:80;
    server_name sentry.example.com;

    # certbot rewrites this block to redirect to HTTPS once a cert exists.
    location / {
        proxy_pass http://127.0.0.1:8787;
        include /etc/nginx/proxy_params;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sentry.example.com;

    # certbot fills these in.
    # ssl_certificate     /etc/letsencrypt/live/sentry.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/sentry.example.com/privkey.pem;

    auth_basic           "VPS Sentry";
    auth_basic_user_file /etc/nginx/.htpasswd-sentry;

    # Optional second lock: uncomment and list your own addresses to refuse
    # everyone else before the password is even asked for.
    # allow 203.0.113.7;
    # deny  all;

    # This dashboard should never be framed, indexed, or referrer-leaked.
    add_header X-Frame-Options            "DENY"        always;
    add_header X-Content-Type-Options     "nosniff"     always;
    add_header Referrer-Policy            "no-referrer" always;
    add_header X-Robots-Tag               "noindex, nofollow" always;
    add_header Strict-Transport-Security  "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
